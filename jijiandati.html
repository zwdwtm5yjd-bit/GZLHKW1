        // ★★★ 核心修复逻辑：数据清洗函数 ★★★
        // 这个函数会解决 "AA" 和 "答案挤在一起" 的问题
        const cleanQuestionData = (questions) => {
            return questions.map(q => {
                let rawAns = q.answer;
                let cleanAns = rawAns;

                // 1. 如果是字符串，先去除空格
                if (typeof rawAns === 'string') {
                    rawAns = rawAns.toUpperCase().replace(/\s+/g, '').replace(/，/g, ','); 
                    
                    // 提取所有有效的选项字符 (A,B,C,D,E,F)
                    const validChars = rawAns.split('').filter(c => /[A-F]/.test(c));
                    // 去重 (解决 AA, BB 问题)
                    const uniqueChars = [...new Set(validChars)];

                    if (q.type === 'single' || q.type === 'judgment') {
                        // 单选/判断：只取第一个有效字符
                        cleanAns = uniqueChars.length > 0 ? uniqueChars[0] : 'A'; 
                    } else if (q.type === 'multi') {
                        // 多选：转换为数组并排序 (解决 "ABD" -> ["A","B","D"] 问题)
                        cleanAns = uniqueChars.sort();
                    }
                } 
                // 2. 如果原本就是数组，确保去重和排序
                else if (Array.isArray(rawAns)) {
                    cleanAns = [...new Set(rawAns)].sort();
                }

                return { ...q, answer: cleanAns };
            });
        };

                    </header>
                    
                    <main className="flex-grow w-full p-4 md:p-6">
                        {isAdmin ? <Admin onBack={()=>setIsAdmin(false)}/> : 
                         !user ? <EntryForm onStart={setUser} /> : 
                         !res ? <Quiz user={user} onFinish={setRes} /> : 
                         <Result res={res} />}
                    </main>
                    
                    <footer className="bg-white border-t py-6 text-center text-xs text-gray-400 mt-auto">
                        <p className="mb-2">内部系统 · 仅限工作交流使用</p>
                        {!isAdmin && (
                            <button onClick={handleAdminLogin} className="hover:text-gray-600 transition flex items-center gap-1 mx-auto">
                                <Icon name="lock" /> 管理员入口
                            </button>
                        )}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
