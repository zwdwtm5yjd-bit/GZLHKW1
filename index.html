<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贵州联合纪委工作办公室 - 学习交流平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-red: #8B1C1C; --tech-blue: #1E3A8A; --bg-light: #F8FAFC; }
        body { font-family: 'Noto Sans SC', sans-serif; background-color: var(--bg-light); overflow-x: hidden; }
        h1, h2, h3, .serif-font { font-family: 'Noto Serif SC', serif; }
        .hero-bg { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); position: relative; }
        
        /* 登录墙样式 */
        .login-bg-animate { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); position: relative; }
        .hidden-mode { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 卡片交互 */
        .nav-card { transition: all 0.4s; cursor: pointer; border-bottom: 4px solid transparent; }
        .nav-card:hover { transform: translateY(-10px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .nav-card.red-theme:hover { border-color: var(--primary-red); }
        .nav-card.blue-theme:hover { border-color: var(--tech-blue); }
        .nav-card.feishu-theme:hover { border-color: #00D6B9; }
        .nav-card.brand-theme:hover { border-color: #D97706; }
        .icon-box { transition: transform 0.3s ease; }
        .nav-card:hover .icon-box { transform: scale(1.1); }
        .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">

    <!-- 登录门禁 -->
    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center login-bg-animate">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-red-900 z-10 fade-in mx-4">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-red-900 rounded-full flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg">
                    <i class="fa-solid fa-star"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 serif-font">贵州联合纪委</h1>
                <p class="text-sm text-gray-500 tracking-widest mt-1">内部工作平台 · 身份验证</p>
            </div>
            <div id="login-error" class="hidden-mode mb-4 p-3 bg-red-50 text-red-700 text-sm rounded border border-red-100 flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i> <span>账号或密码错误</span>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">内部账号</label>
                    <input id="username-input" type="text" class="pl-4 block w-full rounded-lg border-gray-300 border p-2.5 focus:ring-red-900 outline-none transition" placeholder="请输入用户名">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">访问密码</label>
                    <input id="password-input" type="password" class="pl-4 block w-full rounded-lg border-gray-300 border p-2.5 focus:ring-red-900 outline-none transition" placeholder="请输入密码">
                </div>
                <button onclick="attemptLogin()" class="w-full bg-red-900 text-white py-3 rounded-lg hover:bg-red-800 transition font-medium shadow-lg">安全登录</button>
            </div>
        </div>
    </div>

    <!-- 主内容 (默认隐藏) -->

        <header class="bg-white shadow-sm sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-20">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-red-900 rounded-full flex items-center justify-center text-white shadow-md">
                            <i class="fa-solid fa-star text-sm"></i>
                        </div>
                        <div>
                            <h1 class="text-xl font-bold tracking-wide text-gray-900 leading-tight">贵州联合纪委</h1>
                            <p class="text-xs text-gray-500 tracking-wider">工作办公室 · 学习交流平台</p>
                        </div>
                    </div>
                    <nav class="hidden md:flex space-x-8 items-center">
                        <a href="#" class="text-gray-600 hover:text-red-900 font-medium transition">首页</a>
                        <div class="border-l pl-6 ml-2 flex flex-col items-end">
                            <span id="display-name" class="text-sm font-bold text-gray-900">已登录</span>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-green-600">● 在线</span>
                                <button onclick="doLogout()" class="text-xs text-gray-400 hover:text-red-600 underline">退出</button>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <section class="hero-bg py-16 md:py-24 relative overflow-hidden">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                <div class="text-center mb-16 fade-in-up" style="animation-delay: 0.1s;">
                    <h2 class="text-3xl md:text-5xl font-bold text-gray-900 mb-4 tracking-tight">忠诚 · 干净 · 担当</h2>
                    <p class="text-lg text-gray-600 max-w-2xl mx-auto">聚焦主责主业，深化数字赋能。</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 fade-in-up" style="animation-delay: 0.3s;">
                    <!-- 1. 学习知识库 -->
                    <div onclick="window.location.href='zsksy.html'" class="nav-card red-theme bg-white rounded-xl shadow-lg p-8 text-center group">
                        <div class="icon-box w-16 h-16 mx-auto bg-red-50 rounded-2xl flex items-center justify-center mb-6 bg-red-50 text-red-800 group-hover:bg-red-100">
                            <i class="fa-solid fa-book-open text-2xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">学习知识库</h3>
                        <p class="text-sm text-gray-500 mb-4">政策法规、业务指南。</p>
                    </div>
                    <!-- 2. AI数据库 -->
                    <div onclick="alert('正在连接AI检索终端...')" class="nav-card blue-theme bg-white rounded-xl shadow-lg p-8 text-center group">
                        <div class="icon-box w-16 h-16 mx-auto bg-blue-50 rounded-2xl flex items-center justify-center mb-6 text-blue-800 group-hover:bg-blue-100">
                            <i class="fa-solid fa-microchip text-2xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">AI数据库查询</h3>
                        <p class="text-sm text-gray-500 mb-4">智能检索法规。</p>
                    </div>
                    <!-- 3. 飞书办公 -->
                    <div onclick="window.open('https://lcnb6ywyxip9.feishu.cn/base/EO27bu9Q1a9ufwsmP3BcgKRjncc', '_blank')" class="nav-card feishu-theme bg-white rounded-xl shadow-lg p-8 text-center group">
                        <div class="icon-box w-16 h-16 mx-auto bg-teal-50 rounded-2xl flex items-center justify-center mb-6 text-teal-600 group-hover:bg-teal-100">
                            <i class="fa-solid fa-paper-plane text-2xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">飞书办公</h3>
                        <p class="text-sm text-gray-500 mb-4">高效协同工作台。</p>
                    </div>
                    <!-- 4. 品牌建设 -->
                    <div onclick="window.location.href='https://www.ericmm.com/jjpp.html'"  class="nav-card brand-theme bg-white rounded-xl shadow-lg p-8 text-center group">
                        <div class="icon-box w-16 h-16 mx-auto bg-amber-50 rounded-2xl flex items-center justify-center mb-6 text-amber-600 group-hover:bg-amber-100">
                            <i class="fa-solid fa-flag text-2xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">品牌建设</h3>
                        <p class="text-sm text-gray-500 mb-4">清廉文化宣传。</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="updates" class="py-16 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between mb-8 border-b pb-4 border-gray-100">
                    <h2 class="text-2xl font-bold text-gray-900 border-l-4 border-red-800 pl-3">最新学习动态</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- 文章列表 -->
                    <a href="#" class="group block bg-gray-50 rounded-lg overflow-hidden border border-gray-100 hover:shadow-md transition">
                        <div class="h-48 bg-gray-200 overflow-hidden relative">
                            <img src="https://free.picui.cn/free/2025/12/25/694cff975645c.jpg" class="w-full h-full object-cover group-hover:scale-105 transition">
                            <div class="absolute top-2 right-2 bg-red-800 text-white text-xs px-2 py-1 rounded">党风廉政</div>
                        </div>
                        <div class="p-6">
                            <h3 class="text-lg font-bold text-gray-800 group-hover:text-red-800 line-clamp-2">贵州区域召开2025年党风廉政建设和反腐败工作会议</h3>
                        </div>
                    </a>
                    <a href="#" class="group block bg-gray-50 rounded-lg overflow-hidden border border-gray-100 hover:shadow-md transition">
                        <div class="h-48 bg-gray-200 overflow-hidden relative">
                            <img src="https://free.picui.cn/free/2025/12/25/694cff96f066a.jpg" class="w-full h-full object-cover group-hover:scale-105 transition">
                            <div class="absolute top-2 right-2 bg-blue-800 text-white text-xs px-2 py-1 rounded">AI赋能</div>
                        </div>
                        <div class="p-6">
                            <h3 class="text-lg font-bold text-gray-800 group-hover:text-blue-800 line-clamp-2">倡廉洁守红线 讲纪律强担当</h3>
                        </div>
                    </a>
                    <a href="#" class="group block bg-gray-50 rounded-lg overflow-hidden border border-gray-100 hover:shadow-md transition">
                        <div class="h-48 bg-gray-200 overflow-hidden relative">
                            <img src="https://free.picui.cn/free/2025/12/25/694d02a089d76.png" class="w-full h-full object-cover group-hover:scale-105 transition">
                            <div class="absolute top-2 right-2 bg-amber-600 text-white text-xs px-2 py-1 rounded">品牌风采</div>
                        </div>
                        <div class="p-6">
                            <h3 class="text-lg font-bold text-gray-800 group-hover:text-amber-600 line-clamp-2">思想筑廉、行动促廉、制度固廉</h3>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <footer class="bg-slate-900 text-white mt-auto py-8">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <p class="text-sm text-slate-400">内部系统 · 仅限工作交流使用</p>
                <p class="text-xs text-slate-500 mt-1">&copy; 2025 贵州联合纪委工作办公室</p>
            </div>
        </footer>
    </div>

    <!-- 核心验证脚本 -->
    <script>
        // === 账号库 (Updated) ===
        const userDatabase = [
            { u: 'yehua',      p: '19891117', name: 'Yehua' },
            { u: 'duannie',    p: '469273',   name: 'Duannie' },
            { u: 'hejunxian',  p: '116828',   name: 'Hejunxian' },
            { u: 'gewei',      p: '321870',   name: 'Gewei' },
            { u: 'admin',      p: '123456',   name: '管理员' }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const isLoggedIn = localStorage.getItem('gzjw_logged_in');
            const savedName = localStorage.getItem('gzjw_user_name');
            
            if (isLoggedIn === 'true') {
                showMainContent();
                if(savedName) document.getElementById('display-name').innerText = savedName;
            } else {
                showLoginScreen();
            }
        });

        function showMainContent() {
            document.getElementById('login-screen').classList.add('hidden-mode');
            document.getElementById('main-content').classList.remove('hidden-mode');
        }

        function showLoginScreen() {
            document.getElementById('login-screen').classList.remove('hidden-mode');
            document.getElementById('main-content').classList.add('hidden-mode');
        }

        function attemptLogin() {
            const uInput = document.getElementById('username-input').value;
            const pInput = document.getElementById('password-input').value;
            const errorDiv = document.getElementById('login-error');

            const foundUser = userDatabase.find(user => user.u === uInput && user.p === pInput);

            if (foundUser) {
                localStorage.setItem('gzjw_logged_in', 'true');
                localStorage.setItem('gzjw_user_name', foundUser.name);
                document.getElementById('display-name').innerText = foundUser.name;
                errorDiv.classList.add('hidden-mode');
                showMainContent();
            } else {
                errorDiv.classList.remove('hidden-mode');
                document.querySelector('#login-screen > div').classList.add('animate-pulse');
                setTimeout(() => document.querySelector('#login-screen > div').classList.remove('animate-pulse'), 500);
            }
        }

        function doLogout() {
            if(confirm('确定要退出内部系统吗？')) {
                localStorage.removeItem('gzjw_logged_in');
                localStorage.removeItem('gzjw_user_name');
                showLoginScreen();
                document.getElementById('username-input').value = '';
                document.getElementById('password-input').value = '';
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') attemptLogin();
        });
    </script>
</body>
</html>
